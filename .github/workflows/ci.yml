name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    # Création d'une DB temporaire pour les tests
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: notesdb
          POSTGRES_USER: notesuser
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🧪 Exécuter les tests (Pytest)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: notesdb
          DB_USER: notesuser
          DB_PASSWORD: secret
        run: pytest test_app.py

      - name: 🐳 Tester la construction Docker
        run: docker build -t notes-api:ci-test .
